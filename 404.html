<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <meta name="apple-mobile=web-app=title" content="Portfolio">

    <link rel="manifest" href="/images/site.webmanifest">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/style/style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .error-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #4dd0e1 0%, #0d47a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease forwards;
        }

        .error-message {
            font-size: 1.3rem;
            color: #6bb6c4;
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.2s forwards;
            opacity: 0;
        }

        .back-link {
            margin-top: 1.5rem;
            padding: 1rem 3rem;
            background: rgba(77, 208, 225, 0.1);
            border: 2px solid rgba(77, 208, 225, 0.3);
            border-radius: 5px;
            color: #4dd0e1;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeInUp 1s ease 0.4s forwards;
            opacity: 0;
        }

        .back-link:hover {
            background: rgba(77, 208, 225, 0.2);
            border-color: #4dd0e1;
            box-shadow: 0 0 30px rgba(77, 208, 225, 0.5);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .error-title {
                font-size: 2.5rem;
            }

            .error-message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Audio -->
    <audio id="bgMusic" loop>
        <source src="/audio/background-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Audio Control Button -->
    <div class="audio-control muted" id="audioToggle" title="Toggle Music">
        <svg id="audioIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </div>

    <canvas class="smoke-canvas" id="smokeCanvas"></canvas>

    <div class="content">
        <div class="error-container">
            <h1 class="error-title">404 - Page Not Found</h1>
            <div class="glow-line"></div>
            <p class="error-message">Wandered too far, traveler...</p>
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#4dd0e1">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Return Home
            </a>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="/js/bg-animations.js"></script>
    <script src="/js/audio-controls.js"></script>
</body>
</html>
